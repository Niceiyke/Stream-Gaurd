[workspace]
resolver = "2"
members = [
    "crates/sg-core",
    "crates/sg-protocol",
    "crates/sg-tun",
    "crates/sg-network",
    "crates/sg-health",
    "crates/sg-transport",
    "crates/sg-multipath",
    "crates/sg-routing",
    "crates/sg-platform",
    "crates/sg-session",
    "crates/sg-auth",
    "crates/sg-wordlyte",
    "apps/streamguard-service",
    "apps/streamguard-gateway",
    "tests/netem",
]
# `desktop/` (Tauri shell, engineering step 12) is deliberately NOT a member:
# it keeps its own Cargo.lock/toolchain so a broken UI build can never affect
# the engine gates (`cargo check/test/clippy --workspace` from the root).
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `socket2` 0.6's `all` feature exposes the Linux index-based interface
# binding helper used by the per-NIC QUIC path implementation.
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "=2.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tun-rs = "2.8.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# WFP bindings (engineering step 15)
windows = "0.61.3"

sg-core = { path = "crates/sg-core" }
sg-protocol = { path = "crates/sg-protocol" }
sg-tun = { path = "crates/sg-tun" }
sg-network = { path = "crates/sg-network" }
sg-health = { path = "crates/sg-health" }
sg-transport = { path = "crates/sg-transport" }
sg-multipath = { path = "crates/sg-multipath" }
sg-routing = { path = "crates/sg-routing" }
sg-platform = { path = "crates/sg-platform" }
sg-session = { path = "crates/sg-session" }
sg-auth = { path = "crates/sg-auth" }
sg-wordlyte = { path = "crates/sg-wordlyte" }

[profile.release]
lto = "thin"
