[package]
name = "sg-tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "StreamGuard cross-platform virtual NIC abstraction"

[features]
default = []
# Enables the real `tun-rs` (v2) platform backend: Wintun on Windows,
# /dev/net/tun on Linux, utun on macOS. Off by default so the scaffold
# compiles anywhere without drivers; enable on the target box and place
# `wintun.dll` next to the binary (or set `WINTUN_DLL`) on Windows.
native-tun = ["dep:tun-rs"]

[dependencies]
bytes.workspace = true
sg-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# `interruptible` (tun-rs 2.8.9, no extra deps) provides the verified
# timed/cancellable read used by the native `TunInterrupt` backend:
# `SyncDevice::recv_intr_timeout` maps to `poll()` + event pipe on Linux
# and `WaitForMultipleObjects` + event on Windows, returning
# `TimedOut`/`Interrupted` instead of blocking forever (WP-300 req 4).
tun-rs = { workspace = true, optional = true, features = ["interruptible"] }