[package]
name = "streamguard-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "StreamGuard privileged networking service (client engine)"

[[bin]]
name = "streamguard-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
if-addrs = "0.13"
quinn.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sg-auth.workspace = true
sg-core.workspace = true
sg-health.workspace = true
sg-multipath.workspace = true
sg-network.workspace = true
sg-platform.workspace = true
sg-protocol.workspace = true
sg-routing.workspace = true
sg-session.workspace = true
sg-transport = { workspace = true, features = ["quic"] }
sg-tun.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security"] }
windows-core = "0.61"

[dev-dependencies]
async-trait.workspace = true
rcgen.workspace = true
sg-core.workspace = true
streamguard-gateway = { path = "../../apps/streamguard-gateway" }