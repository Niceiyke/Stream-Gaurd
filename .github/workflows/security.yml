name: Security And Dependency Hygiene

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.21.2

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Dependency Policy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit root dependency graph
        continue-on-error: true
        shell: bash
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit --file Cargo.lock

      - name: Audit desktop dependency graph
        continue-on-error: true
        shell: bash
        run: cargo audit --file desktop/src-tauri/Cargo.lock

      - name: Apply root cargo-deny policy
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          manifest-path: ./Cargo.toml

      - name: Apply desktop cargo-deny policy
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          manifest-path: ./desktop/src-tauri/Cargo.toml

      - name: Generate root CycloneDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: Cargo.lock
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/streamguard-sbom/root.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate desktop CycloneDX SBOM
        if: always()
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: desktop/src-tauri/Cargo.lock
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/streamguard-sbom/desktop.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload allowlisted SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamguard-sboms
          path: |
            ${{ runner.temp }}/streamguard-sbom/root.cdx.json
            ${{ runner.temp }}/streamguard-sbom/desktop.cdx.json
          if-no-files-found: warn
          retention-days: 30
